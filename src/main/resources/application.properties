# ════════════════════════════════════════════════════════════════
#  One Joyería (backend) — configuración principal
# ════════════════════════════════════════════════════════════════
spring.application.name=one-joyeria
server.port=8089

# ── Base de datos: MySQL corriendo en Docker (puerto 3306) ──
# Levanta MySQL con:  docker compose up -d   (ver docker-compose.yml)
# La base "onejoyeria" se crea sola gracias a createDatabaseIfNotExist=true.
spring.datasource.url=jdbc:mysql://localhost:3306/onejoyeria?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
# "update" crea y actualiza las tablas a partir de las clases del paquete "modelo".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JSON ──
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Credenciales del administrador (inicio de sesión) ──
app.admin.usuario=admin
app.admin.contrasena=admin
app.admin.nombre=Administrador

# ── CORS: direcciones desde donde el frontend Angular puede llamar a la API ──
# Separadas por coma. Se usan en config/CorsConfig.java
app.cors.origenes=http://localhost:4200,https://*.app.github.dev

server.error.include-stacktrace=never
