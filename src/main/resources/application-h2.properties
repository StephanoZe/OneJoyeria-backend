# ════════════════════════════════════════════════════════════════
#  Perfil "h2": para ejecutar SIN Docker ni MySQL
#  Activar con:  ejecutar-sin-docker.bat   o   --spring.profiles.active=h2
#  Los datos se guardan en la carpeta ./data del proyecto.
# ════════════════════════════════════════════════════════════════
spring.datasource.url=jdbc:h2:file:./data/onejoyeriadb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola: http://localhost:8089/h2-console   (JDBC URL jdbc:h2:file:./data/onejoyeriadb, usuario sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=false
